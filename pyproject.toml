[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prepped"
version = "0.3.0"
description = "Local-first, voice-enabled scenario practice for engineering students"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "httpx2>=2.0.0,<3.0",
  "pytest>=9.0.3,<10.0",
]
# Local speech-to-text. The model is downloaded explicitly, never at startup.
voice = [
  "vosk>=0.3.45,<0.4",
]
# Optional better local text-to-speech. espeak-ng remains the fallback.
voice-piper = [
  "piper-tts>=1.8,<2",
]
voice-cloud = [
  "httpx>=0.27,<1.0",
]
# Optional real-browser acceptance tests; not required by the application at runtime.
browser-test = [
  "playwright>=1.50,<2.0",
]

[tool.setuptools.packages.find]
include = ["prepped*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
