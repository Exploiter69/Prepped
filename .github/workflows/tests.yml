name: tests

on:
  push:
    branches:
      - main
      - "step-4/**"
      - "step-5/**"
      - "feature/**"
      - "feature/learner-profile"
  pull_request:
    branches:
      - main
      - "feature/learner-profile"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Check Python compilation
        run: python -m compileall -q prepped
      - name: Check browser JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/voice.js
          node --check static/learning.js
          node --check static/memory.js
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev,browser-test]"
      - name: Install Chromium for browser acceptance tests
        run: python -m playwright install --with-deps chromium
      - name: Run tests
        run: python -m pytest -q
