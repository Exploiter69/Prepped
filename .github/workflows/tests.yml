name: tests

on:
  push:
    branches:
      - main
      - "step-4/**"
      - "step-5/**"
      - "feature/**"
      - "feature/learner-profile"
  pull_request:
    branches:
      - main
      - "feature/learner-profile"

concurrency:
  group: prepped-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Check Python compilation
        run: python -m compileall -q prepped
      - name: Check browser JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/voice.js
          node --check static/learning.js
          node --check static/memory.js
          node --check static/career.js
          node --check static/progress.js
          node --check static/intelligence.js
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev,browser-test]"
      - name: Validate versioned curriculum and Career Studio content
        run: python -m prepped.content_lint
      - name: Check dependency consistency
        run: python -m pip check
      - name: Audit installed Python dependencies
        run: |
          python -m pip install --upgrade "setuptools>=84.1.0" pip-audit pip-licenses
          pip-audit --skip-editable --format=json --output=pip-audit.json
          pip-licenses --format=json --output-file=dependency-licenses.json
      - name: Install Chromium for browser acceptance tests
        run: python -m playwright install --with-deps chromium
      - name: Run tests
        run: python -m pytest -q
      - name: Publish dependency audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-k-dependency-audit
          path: |
            pip-audit.json
            dependency-licenses.json
          if-no-files-found: warn
          retention-days: 30
